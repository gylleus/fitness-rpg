# Player — Knight master reference, with the standard mace.
# Runtime weapon variants and rigid idle: image-generation/player-sprites/sequences/knight-weapons-v2/.
# The existing asset ID remains stable across this visual redesign.
schema_version = 1

[art]
facing = "right"
view = "profile"

[[assets]]
id = "barbarian_player"
name = "Knight"
kind = "player"
visual_description = """
The player is a broad-shouldered knight enclosed in scratched steel plate. A rounded, angular helmet hides the entire face behind a narrow dark visor and a slotted lower faceplate. Overlapping pauldrons crowd around the thick neck; a worn breastplate, articulated gauntlets, layered knee guards and substantial armored boots give the figure a solid, practical weight. Pale scratches catch on the edges of dull blue-gray metal. Brown leather straps and a heavy belt hold the mismatched pieces together.

A short skirt of faded burgundy cloth hangs in ragged panels below the belt. The knight stands with bent knees and staggered boots, carrying a spiked iron mace close to the forward shoulder. Its short, sturdy haft is wrapped in worn brown leather, and its heavy round head bristles with large triangular spikes. The free gauntlet stays near the chest for balance. There is no shield, cape or second weapon; the closed helmet and compact guard leave little of the person inside exposed.
"""
reference_caption = "one weathered armored knight in strict right-facing side profile, closed steel helmet with narrow dark visor, broad plate pauldrons, scratched breastplate, articulated gauntlets and greaves, heavy armored boots, short burgundy cloth skirt, brown leather straps, bent knees, one spherical spiked iron mace held by a short leather-wrapped handle beside the forward shoulder"

[assets.reference]
prompt = "pixel art, full body, right-facing side profile, weathered steel knight, closed helmet and dark visor, scratched plate armor, broad pauldrons, gauntlets, armored boots, short burgundy cloth skirt, brown leather belt, one spiked spherical iron mace on a short handle, guarded stance, crisp dark outline, transparent background"
negative = "bare face, exposed hair, bare chest, blond barbarian, wooden club, axe, sword, flail chain, shield, cape, extra weapons, front view, text, watermark, cropped boots, cropped mace, photorealism"

[assets.visual]
silhouette = "A compact armored side silhouette with broad layered shoulders, a closed helmet, bent legs and heavy boots. One round spiked mace rises beside the forward shoulder; short cloth panels break up the waist."
equipment = ["one spiked iron mace", "closed steel helmet", "scratched plate armor", "articulated gauntlets and greaves", "armored boots", "short burgundy cloth skirt", "brown leather belt and straps"]
avoid = ["exposed face", "exposed hair", "bare chest", "wooden club", "axe", "sword", "flail", "shield", "flowing cape", "extra weapons", "floating feet", "front-facing torso"]

[assets.animations.idle]
description = "The knight breathes slowly in a calm right-facing guard over 2.4 seconds. Both boots remain completely planted at identical horizontal positions. The knees flex almost imperceptibly while the torso rises or settles by at most one pixel at game resolution. Head, hands and equipped weapon move together as rigid artwork: no wrist rotation, weapon sway, changing weapon shape, side-to-side movement or stepping. Return to the exact original pose for a seamless loop."
loop = true

[assets.animations.walk]
description = "The knight walks in place toward the right through a complete alternating gait. Each boot takes a turn supporting the body while the other passes beneath the hips and reaches forward. Bent knees absorb the weight of the armor, short cloth panels shift with the steps and the single spiked mace stays close to the shoulder. Maintain right-facing profile and return to the starting stride."
loop = true

[assets.animations.attack]
description = "The knight draws the single spiked mace behind and above the helmet, shifts weight onto the rear boot, then delivers a forceful overhead strike down and forward to the right. The front knee bends into the follow-through while the rear boot stays grounded. The same hand holds the mace throughout. The knight pulls the weapon back into the ready guard without turning toward the viewer."
loop = false

[assets.animations.death]
description = "The knight recoils, knees buckle, and the armored body drops to its knees before tipping onto its side toward the right. The closed helmet stays on and the single mace lowers with the gripping hand. The body settles on the ground and remains still; spikes can sink slightly below the body's contact plane rather than lifting the corpse above the floor. No recovery or loop."
loop = false
