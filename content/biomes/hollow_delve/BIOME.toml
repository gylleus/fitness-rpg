schema_version = 1
id = "hollow_delve"
name = "Hollow Delve"
short_description = "Blind things stir beneath abandoned mine galleries and dripping limestone vaults."
description = """
Hollow Delve follows an old excavation into natural limestone chambers. Narrow galleries open beneath ribbed ceilings, then pinch between worked stone and black gaps left by fallen supports. Pale mineral crusts creep over tool marks. Underground pools hold still reflections beneath ledges of compact gravel, and cold moisture gathers on everything brought below.

The workings have no active crew. Split pit props, derailed ore carts and rusted tools remain where the last repairs failed. Spiders hang silk between broken masonry, blind troglodytes feel their way along walls, and green slimes move slowly around abandoned bones. A hostile dwarf and gnoll scavengers occupy the route without turning it into a functioning settlement. Old support braces carry newer braces that now need support themselves.
"""
[setting]
terrain = "Horizontal mine passages connect ribbed limestone caverns, disused timber galleries and still underground pools. A continuous strip of gravel and broken flagstone provides the route above the water."
inhabitants = "Blind troglodytes, giant cave spiders and bone-filled green slimes inhabit the abandoned workings. A hostile beardless dwarf guards a gallery and a gnoll scavenger claims the deeper route. These encounters do not describe all dwarves or gnolls. No miners or staffed settlements remain."
supernatural = "Old skulls turn slowly inside green jelly. Repeated tapping seems to answer itself beyond sealed workings, where wet stone carries the sound too far to locate."
environmental_pressure_and_humor = "Darkness, damp footing, loose rubble and neglected supports make the route oppressive. Successive generations of braces lean against one another with no obvious original support left."
[visual]
lighting = "Dim neutral-to-warm reflected light reveals earthy brown limestone and dusty tan sediment. Brown shadows remain soft and subdued; no blue mineral glow or icy lighting."
materials = ["warm brown limestone", "earth-stained stone", "splintered timber", "rusted iron", "chalk dust", "old silk", "weathered bone", "pale fungus", "clouded quartz"]
weather = "Cold enclosed air, occasional drips and low mist above underground water; no open sky."
ambient_sounds = ["slow ceiling drips", "distant water", "strained timber", "grit beneath feet", "indistinct tapping beyond the wall"]
ambient_motion = "An occasional drip crosses dark stone; hanging silk and loose rope remain almost still."
[[visual.palette]]
name = "Cavern black"
color = "#211B16"
[[visual.palette]]
name = "Wet slate"
color = "#554334"
[[visual.palette]]
name = "Limestone"
color = "#95816A"
[[visual.palette]]
name = "Old timber"
color = "#493727"
[[visual.palette]]
name = "Iron rust"
color = "#8B513B"
[[visual.palette]]
name = "Fungal green"
color = "#8AA778"
[generation]
composition = "An enclosed horizontal mine tunnel with close rear walls, shallow recesses and a heavy low roof. Independent distant, wall and ceiling layers create depth while a separate walking strip and props define the route."
[generation.scene]
canvas = [640, 360]
ground_y = 288
reference_height = 64
view = "orthographic_side"
style = "Refined dark fantasy pixel art with the texture density of Wetlands. Preserve full-resolution source textures independently of the logical canvas. Material edges and controlled mineral or timber detail remain visible, while restrained local contrast keeps actors readable. A nearby low ceiling encloses the horizontal passage."
avoid = ["characters baked into scenery", "isometric view", "a road receding to a vanishing point", "bright cheerful colors", "readable text", "smooth airbrushed edges", "mandatory gaps in the walking surface"]
[generation.ground]
canvas = [256, 96]
surface_y = 24
edge_margin = 16
repeat_x = true
edge_description = "A level slate-gravel lip at row 24, dark compact stone below to the bottom and transparency above. The outer 16 columns share this same flat profile. Large variations stay in the center; no holes or raised obstacles."
[[sites]]
id = "hollow_delve_abandoned_workings"
name = "Abandoned workings"
description = "A line of broken support frames follows an excavation into dark limestone. Empty carts stand beside rails that stop abruptly at fallen rock."
[[sites]]
id = "hollow_delve_pool_ledge"
name = "Sunken cavern ledge"
description = "A continuous gravel ledge skirts a still black pool beneath massive mineral ribs. The water occupies the lower chamber beyond the ledge."
[[background_layers]]
id = "hollow_delve_depth"
name = "Shallow mine recesses"
visual_description = "Dim shallow brown limestone recesses form the enclosed back of a horizontal mine tunnel, with distant supports barely visible in the stone."
[background_layers.generation]
parallax = 0.10
repeat_x = true
transparent = false
composition = "Opaque rear plane of the shared interior recipe. Keep mineral and timber texture subdued; no vast chamber or foreground objects."
[[background_layers]]
id = "hollow_delve_wall"
name = "Close limestone wall piers"
visual_description = "Natural rounded brown rock buttresses and occasional old timber stand against a low rear wall, with broad gaps revealing shallow recesses."
[background_layers.generation]
parallax = 0.32
repeat_x = true
transparent = true
composition = "Separate nearer wall plane of the shared interior recipe. Use real transparency in the gaps and above the wall; the roof, floor and freestanding props are separate."
[[background_layers]]
id = "hollow_delve_roof"
name = "Low stone tunnel roof"
visual_description = "A heavy brown limestone roof presses down above the route. Its mostly rounded underside has shallow uneven shelves and occasional old timber, without hanging needles, icicle teeth or crowded stalactites."
[background_layers.generation]
parallax = 0.68
repeat_x = true
transparent = true
composition = "Continuous overhead cutout in the shared interior recipe's 640 by 240 logical canvas. Solid across the top edge, genuinely transparent beneath the underside. The measured underside follows the ground at a fixed actor-relative clearance."
[[ground_sections]]
id = "hollow_delve_slate_path"
name = "Slate and gravel path"
visual_description = "Earth-brown compact stone and dusty tan gravel form a level cave ledge. Warm gray fractured rock lies underneath; no blue, cyan or purple coloration."
[ground_sections.generation]
composition = "A continuous horizontal earthy brown side-on walking strip on genuine alpha above logical row 24 of 96. The upper 24 rows must be completely transparent. Level tan gravel lip precisely at row 24, with dark umber compact rock below. Sparse warm gray stone chips, no blue highlights. Preserve the flat surface and edges; no tracks, props, figures or pointed formations."
