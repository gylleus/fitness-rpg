[generation]
composition = "Broad stretches of low water and reeds establish an open, horizontal landscape. Broken walkways and strips of raised earth form the visible travel route, bordered by shallow pools, exposed roots, and flood debris. Scattered willows and abandoned cottages interrupt the middle distance, while fog softens distant rooftops and dead trees. Ruined structures and neglected equipment convey former habitation; there are no active settlements, occupied homes, maintained fishing operations, or welcoming inn lights."

[[sites]]
id = "wetlands_abandoned_stilt_cottages"
name = "Abandoned stilt cottages"
description = "A small cluster of empty timber cottages stands unevenly above the water on rotting stilts and raised foundations. Moss weighs down split roofs; narrow porches sag, and broken ladders descend into the mud. Old repairs overlap beneath newer damage. The interiors are dark, with cold hearths and collapsed floorboards."

[[sites]]
id = "wetlands_disused_peat_workings"
name = "Disused peat workings"
description = "Rectangular cuts in a low bank have filled with dark water. Nearby stacks of peat blocks slump beneath the remnants of patched covers, their once-straight edges softened by rain. Reeds grow through the narrow strips of ground between the flooded cuts."

[[sites]]
id = "wetlands_drowned_masonry"
name = "Drowned masonry"
description = "Half-submerged boundary walls and small stone shrines emerge from shallow pools. Worn steps descend into water that hides their lower ends. Silt collects along exposed ledges, while old foundations and tilted burial stones appear where the water has receded."

[[props]]
id = "wetlands_plank_walkway"
name = "Uneven plank walkway"
description = "Bowed gray boards rest on posts of unequal height. Mismatched patches show repeated attempts to keep the crossing usable, but several planks have split or fallen away, exposing shallow water and mud below."

[[props]]
id = "wetlands_channel_marker"
name = "Channel marker"
description = "A leaning wooden stake carries a faded strip of cloth and a series of carved water-level marks. Its lower half is dark with moisture, and fragments of weed cling around the latest flood line."

[[props]]
id = "wetlands_obsolete_road_marker"
name = "Obsolete road marker"
description = "A weathered direction board remains firmly attached to a crooked post. Its arrow points along the vanished course of a road, directly into an uninterrupted stretch of dark water."

[[props]]
id = "wetlands_abandoned_boat"
name = "Abandoned flat-bottomed boat"
description = "A broad, shallow wooden hull sits partly flooded beside a broken landing. Mud streaks its sides; a worn pole, coils of rotting rope, and a battered bailing bucket lie among leaves and standing water inside."

[[props]]
id = "wetlands_wicker_fish_traps"
name = "Discarded wicker traps"
description = "Long eel baskets and rounded fish traps lie tipped against the bank. Their wicker ribs are stained with silt, split at the narrow openings, and threaded with young reeds."

[[props]]
id = "wetlands_collapsed_net_rack"
name = "Collapsed net rack"
description = "Torn fishing nets hang in heavy folds from a wooden rack with one broken upright. Frayed mesh trails into the water, holding leaves, twigs, and patches of green growth."

[[props]]
id = "wetlands_unlit_lantern"
name = "Abandoned lantern"
description = "A small iron lantern hangs beneath a decaying eave or beside an empty landing. Rust gathers around the hinges, cloudy glass obscures its empty interior, and one cracked pane admits damp air. No flame burns inside."

[[decorations]]
id = "wetlands_reed_clump"
name = "Reeds and rushes"
description = "Dense stems of dull olive and straw yellow grow along the margins of pools. Bent stalks cross above the water, and dead blades collect in tangled mats around their bases."

[[decorations]]
id = "wetlands_duckweed"
name = "Drifting duckweed"
description = "Small muted green leaves gather in irregular rafts across sheltered water. Narrow black gaps and curved breaks interrupt the surface where water moves around posts and roots."

[[decorations]]
id = "wetlands_willow_roots"
name = "Exposed willow roots"
description = "Thick, knotted roots grip an eroded peat bank beneath a leaning willow. Wet bark darkens their undersides, while coarse grass and stranded reeds catch in the spaces between them."

[[decorations]]
id = "wetlands_shelf_fungi"
name = "Pale shelf fungi"
description = "Small cream and gray fungal shelves crowd the shaded sides of rotten posts and fallen branches. Their layered edges stand out against dark, saturated wood."

[[decorations]]
id = "wetlands_flood_debris"
name = "Flood debris"
description = "Branches, broken fence rails, and scraps of faded fabric lodge against roots and supports above the current waterline. Mud coats the lower pieces, marking the height of an earlier flood."

[[decorations]]
id = "wetlands_sinking_fence"
name = "Sinking fence remnants"
description = "A short run of crooked posts emerges from coarse grass and shallow water. A few warped rails remain attached, descending toward the mud until the final section disappears beneath it."
