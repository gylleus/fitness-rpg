const $=selector=>document.querySelector(selector);
const modifierLabel=({stat,value})=>{const pct=n=>Number(n.toFixed(2))+'%';switch(stat){case 'health':return '+'+value+' health';case 'armor':return '+'+value+' armor';case 'damage':return '+'+value+' damage';case 'pushup_damage_coefficient':return '+'+pct(value*100)+' damage per pushup';case 'crit_chance_bps':return '+'+pct(value/100)+' crit chance';case 'crit_damage_bps':return '+'+pct(value/100)+' crit damage';}};
for(const category of new Set(items.map(item=>item.category))){const option=document.createElement('option');option.value=category;option.textContent=category.replaceAll('_',' ');$('#category').append(option);}
function draw(){const query=$('#search').value.toLowerCase();const selected=items.filter(item=>(!$('#category').value||item.category===$('#category').value)&&(!$('#rarity').value||item.rarity===$('#rarity').value)&&(item.name+' '+item.visualDescription).toLowerCase().includes(query));$('main').replaceChildren();$('#count').textContent=selected.length+' items';document.documentElement.style.setProperty('--icon',$('#size').value+'px');for(const item of selected){const card=document.createElement('article');card.className=item.rarity;const label=document.createElement('small');label.textContent=item.rarity+' · tier '+item.tier;const img=document.createElement('img');img.src=item.image;img.alt=item.name;img.loading='lazy';const name=document.createElement('h2');name.textContent=item.name;const stats=document.createElement('p');stats.className='stats';stats.textContent=[item.damageMin!==undefined?item.damageMin+'–'+item.damageMax+' damage':'',item.armor?item.armor+' armor':'',...item.modifiers.map(modifierLabel)].filter(Boolean).join(' · ');const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Appearance';const prose=document.createElement('p');prose.textContent=item.visualDescription;detail.append(summary,prose);card.append(label,img,name,stats,detail);$('main').append(card);}}
for(const id of ['search','category','rarity','size'])$('#'+id).addEventListener('input',draw);draw();
</script></html>
